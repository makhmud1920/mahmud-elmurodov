# Render Blueprint — web-service (database Neon'da, alohida).
# Render dashboard: New + -> Blueprint -> shu repo -> Apply

services:
  - type: web
    name: portfolio-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true          # har git push'da avtomatik qayta deploy
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true   # Render xavfsiz kalit avtomatik yaratadi
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: AUTO_SEED_ADMIN
        value: "true"         # birinchi ishga tushganda adminni yaratadi
      - key: ADMIN_USERNAME
        sync: false           # qiymatni Render dashboard'da qo'lda kiritasiz
      - key: ADMIN_PASSWORD
        sync: false           # maxfiy — dashboard'da kiritasiz
      - key: FRONTEND_ORIGINS
        sync: false           # frontend manzilingiz
      - key: DATABASE_URL
        sync: false           # Neon'dan olingan connection string'ni dashboard'da kiritasiz

  # --- Frontend (Vite statik sayt) ---
  - type: web
    name: mahmud
    runtime: static
    rootDir: portfolio-frontend       # monorepo: frontend shu papkada
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://portfolio-backend-j9dh.onrender.com
    routes:
      - type: rewrite                 # SPA — barcha yo'llar index.html'ga
        source: /*
        destination: /index.html
